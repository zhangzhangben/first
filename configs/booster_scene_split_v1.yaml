split_name: booster_scene_split_v1
split_strategy: scene_level_holdout
notes:
- Validation split is scene-level to avoid train/val leakage across samples from the
  same scene.
- Validation scenes intentionally include reflective, transparent, and texture-poor
  hard cases.
- This split is for local ablation only and must not be confused with the official
  Booster hidden test benchmark.
