project:
  name: fastfoundation_booster_stage
  notes:
    - "Current stage uses Booster for local training/validation because it is the only available train-time dataset."
    - "This protocol is a local Booster-stage protocol, not the final multi-dataset protocol."
    - "Independent eval uses eval_booster.py on local data only; official leaderboard claims still require separate submission on test."

model:
  family: Fast-FoundationStereo
  model_dir: weights/23-36-37/model_best_bp2_serialize.pth
  cfg_path: weights/23-36-37/cfg.yaml

data:
  dataset: booster
  booster_root: booster_gt
  split_dir_name: train
  split_file: configs/booster_scene_split_v1.yaml
  train_setups: [balanced, unbalanced]
  val_setups: [balanced, unbalanced]
  scale: 1.0
  balanced_input_scale: 0.25
  unbalanced_input_scale: 1.0
  match_unbalanced_left_to_right: 1

train:
  train_scope: all
  batch_size: 1
  num_workers: 2
  epochs: 3
  grad_clip: 1.0
  amp_dtype: bf16
  seed: 0
  train_iters: 8
  max_train_batches: null
  sequence_loss_gamma: 0.9
  freeze_batch_norm: false

loss:
  name: fast_sequence
  source: "RAFT/MoCha-style iterative sequence loss adapted to Fast-FoundationStereo's init disparity."
  init_weight: 1.0

optimizer:
  name: AdamW
  lr: 0.0001
  weight_decay: 0.0
  eps: 1.0e-06

scheduler:
  name: OneCycleLR
  pct_start: 0.01
  anneal_strategy: linear
  cycle_momentum: false
  extra_steps: 100

validation:
  monitor_every_epoch: true
  valid_iters: 8
  max_val_batches: null
  benchmark_gt_resolution: quarter
  paper_protocol: booster_q
  hiera: 0
  low_memory: 0
  max_disp: 416
  independent_eval_script: scripts/eval_booster.py
  notes:
    - "Training-loop validation is monitor-only."
    - "Final claims must use independent eval_booster.py."
    - "Independent eval here is still local formal eval, not official hidden-test submission."

logging:
  log_every: 20
  save_every: 1
  save_serialized_model: true
  export_cfg_for_eval: true

outputs:
  out_dir: exp_unified_fastfoundation_booster_baseline_v1
